{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit student' if editing else 'Add student' }}</h1>
<p class="note">Fields marked * are required.</p>

{% if error %}<div class="alert alert-error">⚠️ {{ error }}</div>{% endif %}

<form class="form" method="post">
  <label>Roll number *
    <input name="roll_no" maxlength="30" required value="{{ student.roll_no or '' }}" placeholder="e.g. CS104">
  </label>
  <label>Full name *
    <input name="name" maxlength="100" required value="{{ student.name or '' }}" placeholder="e.g. Priya Nair">
  </label>
  <label>Department
    <input name="department" maxlength="100" value="{{ student.department or '' }}" placeholder="e.g. Computer Science">
  </label>
  <label>Email
    <input type="email" name="email" maxlength="150" value="{{ student.email or '' }}" placeholder="name@example.com">
  </label>
  <label>Attendance % (0-100) *
    <div class="range-row">
      <input type="range" id="scoreRange" min="0" max="100" step="1" value="{{ student.attendance or 0 }}">
      <input type="number" id="scoreNumber" name="attendance" min="0" max="100" step="0.1" required value="{{ student.attendance }}">
    </div>
  </label>
  <div class="form-actions">
    <button class="btn" type="submit">Save</button>
    <a href="{{ url_for('students') }}">Cancel</a>
  </div>
</form>
{% endblock %}
